<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4">
  <form
    class="w-full max-w-md bg-white rounded-xl shadow-lg p-6"
    (ngSubmit)="login()"
    #formulario="ngForm"
    novalidate
  >
    <!-- Título -->
    <h1 class="text-2xl font-semibold text-center text-slate-800 mb-1">Iniciar sesión</h1>
    <p class="text-sm text-center text-slate-500 mb-6">
      Sistema de autoevaluación CACEI
    </p>

    <!-- Correo -->
    <div class="mb-4">
      <label for="email" class="form-label">Correo institucional</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        required
        [(ngModel)]="email"
        #campoEmail="ngModel"
        placeholder="correo@uv.mx"
        class="form-input"
        [attr.aria-invalid]="campoEmail.invalid && campoEmail.touched"
      />
      @if (campoEmail.invalid && campoEmail.touched) {
        <p class="mt-1 text-xs text-red-600">Escriba un correo válido.</p>
      }
    </div>

    <!-- Contraseña -->
    <div class="mb-6">
      <label for="password" class="form-label">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        [(ngModel)]="password"
        #campoPassword="ngModel"
        placeholder="••••••••"
        class="form-input"
        [attr.aria-invalid]="campoPassword.invalid && campoPassword.touched"
      />
      @if (campoPassword.invalid && campoPassword.touched) {
        <p class="mt-1 text-xs text-red-600">La contraseña es obligatoria.</p>
      }
    </div>

    <!-- Botón -->
    <button
      type="submit"
      class="btn-primary w-full gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
      [disabled]="formulario.invalid || enviando()"
      [attr.aria-busy]="enviando()"
    >
      @if (enviando()) {
        <span
          class="h-4 w-4 rounded-full border-2 border-white/40 border-t-white animate-spin motion-reduce:animate-none"
          aria-hidden="true"
        ></span>
      }
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>

    <!-- Lo anuncia quien navega con lector de pantalla, que no ve el giro. -->
    @if (enviando()) {
      <p class="sr-only" role="status" aria-live="polite">Verificando credenciales…</p>
    }

    <!-- Error -->
    @if (error()) {
      <p class="mt-4 text-sm text-red-600 text-center" role="alert">
        {{ error() }}
      </p>
    }
  </form>
</div>
