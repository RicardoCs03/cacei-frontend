<nav class="w-64 h-full bg-slate-900 text-slate-200 shadow-lg" aria-label="Menú principal">
  <!-- Encabezado del menú -->
  <div class="px-4 py-5 border-b border-white/10">
    <p class="text-xs text-slate-400 uppercase tracking-widest">Menú</p>
    <p class="text-sm font-semibold text-white">{{ titulo }}</p>
  </div>

  <ul class="p-4 space-y-1 text-sm">
    @for (opcion of opciones; track opcion.ruta) {
      <li>
        <a
          [routerLink]="opcion.ruta"
          routerLinkActive="sidebar-link-active"
          [routerLinkActiveOptions]="{ exact: !!opcion.exacta }"
          class="sidebar-link"
        >
          {{ opcion.etiqueta }}
        </a>
      </li>
    }
  </ul>
</nav>
