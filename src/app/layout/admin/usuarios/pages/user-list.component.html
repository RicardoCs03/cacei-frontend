<section class="space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <h3 class="text-xl font-semibold text-slate-800">
      Usuarios
    </h3>

    <button (click)="createUsuario()" class="btn-primary">
      + Nuevo usuario
    </button>
  </div>

  <!-- Tabla -->
  <div class="overflow-x-auto bg-white rounded-xl border border-slate-200 shadow-sm">
    <table class="min-w-full divide-y divide-slate-200">
      <thead class="bg-slate-50">
        <tr>
          <th class="table-th text-center">Correo</th>
          <th class="table-th text-center">Nombre</th>
          <th class="table-th text-center">Rol</th>
          <th class="table-th text-right">Acciones</th>
        </tr>
      </thead>

      <tbody class="divide-y divide-slate-100">
        <tr *ngFor="let user of users" class="hover:bg-slate-50">
          <td class="table-td text-center">{{ user.email }}</td>
          <td class="table-td text-center">{{ user.nombre }}</td>
          <td class="table-td text-center">
            {{ user.role === 'ROLE_ADMINISTRADOR' ? 'Administrador' : (user.role === 'ROLE_PROFESOR' ? 'Profesor' : '-') }}
          </td>

          <td class="table-td text-right space-x-2">

            <button (click)="editUsuario(user.id!)" class="btn-edit">
              Editar
            </button>

            <button (click)="deleteUsuario(user.id!, user.nombre + ' ' + user.apepat + ' ' + user.apemat)" class="btn-delete">
              Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</section>
