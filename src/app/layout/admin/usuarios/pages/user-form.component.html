<section class="max-w-3xl space-y-6">

  <!-- Título -->
  <div>
    <h3 class="text-xl font-semibold text-slate-800">
      {{ isEdit ? 'Editar' : 'Nuevo' }} Usuario
    </h3>

    <p class="text-sm text-slate-500 mt-1">
      Completa la información del usuario
    </p>
  </div>

  @if (error()) {
    <p class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">{{ error() }}</p>
  }

  @if (cargando()) {
    <div class="flex flex-col items-center gap-3 py-12" role="status" aria-live="polite">
      <span
        class="h-8 w-8 rounded-full border-2 border-slate-200 border-t-primary animate-spin motion-reduce:animate-none"
        aria-hidden="true"
      ></span>
      <p class="text-sm text-slate-500">Cargando…</p>
    </div>
  } @else {


  <!-- Formulario -->
  <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <!-- Nombre -->
      <div>
        <label for="usu-nombre" class="form-label">Nombre</label>
        <input id="usu-nombre"
          type="text"
          [(ngModel)]="user.nombre"
          class="form-input"
        />
      </div>

      <!-- Apellido paterno -->
      <div>
        <label for="usu-apepat" class="form-label">Apellido paterno</label>
        <input id="usu-apepat"
          type="text"
          [(ngModel)]="user.apepat"
          class="form-input"
        />
      </div>

      <!-- Apellido materno -->
      <div>
        <label for="usu-apemat" class="form-label">Apellido materno</label>
        <input id="usu-apemat"
          type="text"
          [(ngModel)]="user.apemat"
          class="form-input"
        />
      </div>

      <!-- Email -->
      <div>
        <label for="usu-email" class="form-label">Correo electrónico</label>
        <input id="usu-email"
          type="email"
          [(ngModel)]="user.email"
          class="form-input"
        />
      </div>

      <!-- Password -->
      @if (!isEdit) {
        <div>
          <label for="usu-password" class="form-label">Contraseña</label>
          <input id="usu-password"
            type="password"
            [(ngModel)]="user.password"
            class="form-input"
          />
        </div>
      }

      <!-- Fecha de nacimiento -->
      <div>
        <label for="usu-fecnac" class="form-label">Fecha de nacimiento</label>
        <input id="usu-fecnac"
          type="date"
          [(ngModel)]="user.fecnac"
          class="form-input"
        />
      </div>

      <!-- Género -->
      <div>
        <label for="usu-genero" class="form-label">Género</label>
        <select id="usu-genero" [(ngModel)]="user.genero" class="form-input">
          <option value="">Seleccione género</option>
          <option value="M">Masculino</option>
          <option value="F">Femenino</option>
          <option value="O">Otro</option>
        </select>
      </div>

      <!-- Celular -->
      <div>
        <label for="usu-celular" class="form-label">Celular</label>
        <input id="usu-celular"
          type="tel"
          [(ngModel)]="user.celular"
          class="form-input"
        />
      </div>

      <!-- Rol -->
      <div>
        <label for="usu-rol" class="form-label">Rol</label>
        <select id="usu-rol" [(ngModel)]="user.rol" class="form-input">
          <option value="">Seleccione rol</option>
          <option value="ADMINISTRADOR">Administrador</option>
          <option value="PROFESOR">Profesor</option>
        </select>
      </div>

      <!-- Activo -->
      <div class="flex items-center gap-2 mt-6">
        <input
          type="checkbox"
          [(ngModel)]="user.isActive"
          class="h-4 w-4 text-indigo-600"
        />
        <span class="text-sm text-slate-700">Activo</span>
      </div>

    </div>

    <!-- Acciones -->
    <div class="mt-6 flex justify-end gap-3">
      <button
        (click)="cancel()"
        class="btn-outline"
      >
        Cancelar
      </button>

      <button
        (click)="saveUser()"
        class="btn-primary"
      >
        Guardar
      </button>
    </div>

  </div>
  }
</section>
