<section class="space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-semibold text-slate-800">
      Cursos
    </h1>

    <button
      type="button"
      (click)="create()"
      class="btn-primary">
      + Nuevo curso
    </button>
  </div>

    @if (sinContenido) {
    <app-estado-panel
      [cargando]="cargando()"
      [error]="error()"
      [mensajeVacio]="mensajeVacio"
      accionVacio="Registrar el primer curso"
      (reintentar)="cargar()"
      (accion)="create()"
    />
  } @else {
  <div class="overflow-x-auto bg-white rounded-xl border border-slate-200 shadow-sm">
      <table class="min-w-full divide-y divide-slate-200">

        <thead class="bg-slate-50">
          <tr>
            <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">
              Nombre
            </th>
            <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">
              Salón
            </th>
            <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">
              Periodo
            </th>
            <th scope="col" class="px-4 py-3 text-right text-xs font-semibold text-slate-600 uppercase">
              Acciones
            </th>
          </tr>
        </thead>

        <tbody class="divide-y divide-slate-100">

          @for (curso of datos(); track curso.id) {

            <tr class="hover:bg-slate-50">
            <!-- Nombre -->
            <td class="px-4 py-3 text-sm text-slate-700">
              {{ curso.nombreEE }} - {{ curso.nrc }}
            </td>

            <!-- Salón -->
            <td class="px-4 py-3 text-sm text-slate-700">
              {{ curso.salon }}
            </td>

            <!-- Periodo -->
            <td class="px-4 py-3 text-sm text-slate-700">
              {{ curso.periodo }}
            </td>

            <!-- Acciones -->
            <td class="px-4 py-3 text-right space-x-2">
              <button
                type="button"
                (click)="edit(curso.id!)"
                class="btn-edit">
                Editar
              </button>

              <button
                type="button"
                (click)="remove(curso.id!, curso.nombreEE + ' - ' + curso.nrc)"
                class="btn-delete">
                Eliminar
              </button>
            </td>
          </tr>
        }

        </tbody>
      </table>
    </div>
  }

</section>
