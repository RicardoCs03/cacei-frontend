<section class="space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-semibold text-slate-800">
      Programas de Estudio
    </h1>

    <button
      type="button"
      (click)="create()"
      class="btn-primary"
    >
      + Nuevo programa
    </button>
  </div>

    @if (sinContenido) {
    <app-estado-panel
      [cargando]="cargando()"
      [error]="error()"
      [mensajeVacio]="mensajeVacio"
      accionVacio="Registrar el primer programa"
      (reintentar)="cargar()"
      (accion)="create()"
    />
  } @else {
  <div class="overflow-x-auto bg-white rounded-xl border border-slate-200 shadow-sm">
      <table class="min-w-full divide-y divide-slate-200">
        <thead class="bg-slate-50">
          <tr>
            <th scope="col" class="table-th">Nombre del programa</th>
            <th scope="col" class="table-th text-right">Acciones</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-slate-100">
          @for (programa of datos(); track programa.id) {

            <tr class="hover:bg-slate-50">
            <td class="table-td">
              {{ programa.nombre }}
            </td>

            <td class="table-td text-right">
              <div class="inline-flex items-center gap-2">

                <button
                  type="button"
                  (click)="edit(programa.id!)"
                  class="btn-edit"
                >
                  Editar
                </button>

                <button
                  type="button"
                  (click)="remove(programa.id!, programa.nombre)"
                  class="btn-delete"
                >
                  Eliminar
                </button>

              </div>
            </td>
          </tr>
        }
        </tbody>
      </table>
    </div>
  }

</section>
