<section class="space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-semibold text-slate-800">
      Alumnos
    </h1>

    <button
      type="button"
      (click)="create()"
      class="btn-primary"
    >
      + Nuevo alumno
    </button>
  </div>

    @if (sinContenido) {
    <app-estado-panel
      [cargando]="cargando()"
      [error]="error()"
      [mensajeVacio]="mensajeVacio"
      accionVacio="Registrar el primer alumno"
      (reintentar)="cargar()"
      (accion)="create()"
    />
  } @else {
  <div class="overflow-x-auto bg-white rounded-xl border border-slate-200 shadow-sm">
      <table class="min-w-full divide-y divide-slate-200">

        <thead class="bg-slate-50">
          <tr>
            <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">
              Matrícula
            </th>
            <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">
              Nombre
            </th>
            <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">
              Programa Educativo
            </th>
            <th scope="col" class="px-4 py-3 text-right text-xs font-semibold text-slate-600 uppercase">
              Acciones
            </th>
          </tr>
        </thead>

        <tbody class="divide-y divide-slate-100">

          @for (a of datos(); track a.id) {

            <tr class="hover:bg-slate-50">
            <!-- Matrícula -->
            <td class="px-4 py-3 text-sm text-slate-700 font-medium">
              {{ a.matricula }}
            </td>

            <!-- Nombre completo -->
            <td class="px-4 py-3 text-sm text-slate-700">
              {{ a.nombre }} {{ a.apepat }} {{ a.apemat }}
            </td>

            <!-- Programa -->
            <td class="px-4 py-3 text-sm text-slate-700">
              {{ a.programaEducativo }}
            </td>

            <!-- Acciones -->
            <td class="px-4 py-3 text-right space-x-2">
              <button
                type="button"
                (click)="edit(a.id!)"
                class="btn-edit"
              >
                Editar
              </button>

              <button
                type="button"
                (click)="remove(a.id!, a.nombre + ' ' + a.apepat + ' ' + a.apemat)"
                class="btn-delete"
              >
                Eliminar
              </button>
            </td>
          </tr>
        }

        </tbody>
      </table>
    </div>
  }

</section>
