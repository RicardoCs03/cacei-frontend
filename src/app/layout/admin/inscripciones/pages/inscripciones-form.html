<section class="max-w-3xl mx-auto bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6">

  <!-- Header -->
  <h3 class="text-xl font-semibold text-slate-800">
    {{ isEdit ? 'Editar' : 'Nueva' }} Inscripción
  </h3>

  @if (error()) {
    <p class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">{{ error() }}</p>
  }

  @if (cargando()) {
    <div class="flex flex-col items-center gap-3 py-12" role="status" aria-live="polite">
      <span
        class="h-8 w-8 rounded-full border-2 border-slate-200 border-t-primary animate-spin motion-reduce:animate-none"
        aria-hidden="true"
      ></span>
      <p class="text-sm text-slate-500">Cargando…</p>
    </div>
  } @else {



  <!-- Alumno y Curso -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

    <div>
      <label for="ins-alumno" class="form-label">Alumno</label>
      <select
        id="ins-alumno"
        name="idAlumno"
        class="form-input"
        [(ngModel)]="inscripcion.idAlumno"
        required
      >
        <option [ngValue]="undefined" disabled>Seleccione alumno</option>
        @for (a of alumnos; track a.id) {
          <option [ngValue]="a.id">
            {{ a.matricula }} — {{ a.nombre }} {{ a.apepat }} {{ a.apemat }}
          </option>
        }
      </select>
    </div>

    <div>
      <label for="ins-curso" class="form-label">Curso</label>
      <select
        id="ins-curso"
        name="idCurso"
        class="form-input"
        [(ngModel)]="inscripcion.idCurso"
        required
      >
        <option [ngValue]="undefined" disabled>Seleccione curso</option>
        @for (c of cursos; track c.id) {
          <option [ngValue]="c.id">
            {{ c.nombreEE }} — NRC {{ c.nrc }} — {{ c.periodo }} ({{ c.salon }})
          </option>
        }
      </select>
    </div>

  </div>

  <!-- Tipo y fecha -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

    <div>
      <label for="ins-tipo" class="form-label">Tipo de inscripción</label>
      <select
        id="ins-tipo"
        name="tipoInscripcion"
        class="form-input"
        [(ngModel)]="inscripcion.tipoInscripcion"
      >
        <option value="" disabled>Seleccione el tipo</option>
        @for (t of tipos; track t) {
          <option [value]="t">{{ t }}</option>
        }
      </select>
    </div>

    <div>
      <label for="ins-fecha" class="form-label">Fecha de inscripción</label>
      <input
        id="ins-fecha"
        name="fecInscripcion"
        type="date"
        class="form-input"
        [(ngModel)]="inscripcion.fecInscripcion"
      />
    </div>

  </div>

  <!-- Calificación -->
  <div class="md:w-1/2">
    <label for="ins-calificacion" class="form-label">Calificación final</label>
    <input
      id="ins-calificacion"
      name="calificacion"
      type="number"
      min="0"
      max="10"
      step="0.1"
      class="form-input tabular-nums"
      [(ngModel)]="inscripcion.calificacion"
      placeholder="Sin calificar"
    />
    <p class="mt-1 text-xs text-slate-500">Escala de 0 a 10. Puede dejarse vacía.</p>
  </div>

  <!-- Activa -->
  <div>
    <label class="flex items-center gap-2 text-sm text-slate-700">
      <input
        type="checkbox"
        name="isActive"
        [(ngModel)]="inscripcion.isActive"
        class="h-4 w-4 accent-primary"
      />
      Inscripción vigente
    </label>
    <p class="mt-1 text-xs text-slate-500">
      Al desactivarla el alumno queda dado de baja del curso, conservando el registro.
    </p>
  </div>

  <!-- Botones -->
  <div class="flex justify-end gap-3 pt-4">

    <button
      type="button"
      (click)="cancel()"
      class="px-4 py-2 rounded-lg text-sm font-medium
             bg-slate-100 text-slate-700 hover:bg-slate-200">
      Cancelar
    </button>

    <button
      type="button"
      (click)="save()"
      class="px-4 py-2 rounded-lg text-sm font-medium
             bg-indigo-600 text-white hover:bg-indigo-700">
      Guardar
    </button>

  </div>
  }
</section>
