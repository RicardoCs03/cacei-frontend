<section class="space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-semibold text-slate-800">
      Inscripciones
    </h1>

    <button
      type="button"
      (click)="create()"
      class="btn-primary"
    >
      + Nueva inscripción
    </button>
  </div>

    @if (sinContenido) {
    <app-estado-panel
      [cargando]="cargando()"
      [error]="error()"
      [mensajeVacio]="mensajeVacio"
      accionVacio="Registrar la primera inscripción"
      (reintentar)="cargar()"
      (accion)="create()"
    />
  } @else {
  <div class="overflow-x-auto bg-white rounded-xl border border-slate-200 shadow-sm">
      <table class="min-w-full divide-y divide-slate-200">

        <thead class="bg-slate-50">
          <tr>
            <th scope="col" class="table-th">Alumno</th>
            <th scope="col" class="table-th">Curso</th>
            <th scope="col" class="table-th text-center">Calificación final</th>
            <th scope="col" class="table-th text-right">Acciones</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-slate-100">
          @for (i of datos(); track i.id) {

            <tr class="hover:bg-slate-50">

            <!-- Alumno -->
            <td class="table-td">
              {{ i.nombreCompletoAlumno }}
            </td>

            <!-- Curso -->
            <td class="table-td">
              {{ i.nombreEE }} - {{ i.nrcCurso }}
            </td>

            <!-- Calificación -->
            <td class="table-td text-center">
              {{ i.calificacion ?? '-' }}
            </td>

            <!-- Acciones -->
            <td class="table-td text-right whitespace-nowrap space-x-2">
              <button
                type="button"
                (click)="edit(i.id!)"
                class="btn-edit">
                Editar
              </button>

              <button
                type="button"
                (click)="remove(i.id!, i.nombreCompletoAlumno)"
                class="btn-delete">
                Eliminar
              </button>
            </td>

          </tr>
        }
        </tbody>

      </table>
    </div>
  }

</section>
