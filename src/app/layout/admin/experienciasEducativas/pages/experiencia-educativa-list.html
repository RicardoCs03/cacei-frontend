<section class="space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-semibold text-slate-800">
      Experiencias Educativas
    </h1>

    <button
      type="button"
      (click)="create()"
      class="btn-primary"
    >
      + Nueva experiencia
    </button>
  </div>

    @if (sinContenido) {
    <app-estado-panel
      [cargando]="cargando()"
      [error]="error()"
      [mensajeVacio]="mensajeVacio"
      accionVacio="Registrar la primera experiencia educativa"
      (reintentar)="cargar()"
      (accion)="create()"
    />
  } @else {
  <div class="overflow-x-auto bg-white rounded-xl border border-slate-200 shadow-sm">
      <table class="min-w-full divide-y divide-slate-200">
        <thead class="bg-slate-50">
          <tr>
            <th scope="col" class="table-th">Nombre</th>
            <th scope="col" class="table-th">Créditos</th>
            <th scope="col" class="table-th">Programa Educativo</th>
            <th scope="col" class="table-th text-right">Acciones</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-slate-100">
          @for (exp of datos(); track exp.id) {

            <tr class="hover:bg-slate-50">
            <!-- Nombre -->
            <td class="table-td">
              {{ exp.nombre }}
            </td>

            <!-- Créditos -->
            <td class="table-td text-center">
              {{ exp.creditos }}
            </td>

            <!-- Programa -->
            <td class="table-td">
              {{ exp.programaEducativofk?.nombre || exp.programaEducativo }}
            </td>

            <!-- Acciones -->
            <td class="table-td text-right whitespace-nowrap space-x-2">
              <button
                type="button"
                (click)="edit(exp.id!)"
                class="btn-edit"
              >
                Editar
              </button>

              <button
                type="button"
                (click)="remove(exp.id!, exp.nombre)"
                class="btn-delete"
              >
                Eliminar
              </button>
            </td>
          </tr>
        }
        </tbody>
      </table>
    </div>
  }

</section>
